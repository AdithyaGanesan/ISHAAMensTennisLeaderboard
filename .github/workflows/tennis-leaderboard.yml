name: Update Tennis Leaderboard

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:   # lets you manually trigger a run from the GitHub UI

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests numpy

      - name: Run scraper (pulls new matches only)
        working-directory: TennisLeaderboard
        run: python3 tTest.py

      - name: Compute leaderboard and push to website
        working-directory: TennisLeaderboard
        env:
          LEADERBOARD_ENDPOINT_URL: ${{ secrets.LEADERBOARD_ENDPOINT_URL }}
          LEADERBOARD_UPDATE_SECRET: ${{ secrets.LEADERBOARD_UPDATE_SECRET }}
        run: python3 tLeaderboard.py

      - name: Commit updated data files back to the repo
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@github.com"
          git add TennisLeaderboard/boys_matches.json TennisLeaderboard/seen_match_ids.json
          git diff --staged --quiet || git commit -m "Update match data [automated]"
          git push
